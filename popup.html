<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Vault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Ambient Ferrari/Apple Light & Shadow Backdrop -->
  <div class="ambient-backdrop" aria-hidden="true">
    <div class="ambient-orb orb-primary"></div>
    <div class="ambient-orb orb-secondary"></div>
    <div class="ambient-orb orb-tertiary"></div>
    <div class="ambient-noise"></div>
  </div>

  <div class="app-container">

    <!-- Header: Brand, Live Metrics & Primary Actions -->
    <header class="app-header glass-panel">
      <div class="brand-group">
        <div class="brand-logo-ring">
          <svg class="brand-logo-icon" viewBox="0 0 24 24" fill="none">
            <path d="M4 7C4 5.34315 5.34315 4 7 4H17C18.6569 4 20 5.34315 20 7V17C20 18.6569 18.6569 20 17 20H7C5.34315 20 4 18.6569 4 17V7Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 12H15M12 9V15" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="6.5" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-dasharray="2 3"/>
            <defs>
              <linearGradient id="logo-grad" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FFFFFF" />
                <stop offset="1" stop-color="#A1A1AA" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-meta">
          <span class="brand-name">Tab Vault</span>
          <span id="statsPill" class="stats-sub-text" title="Total saved vaults, tabs, and RAM freed">0 vaults · 0 tabs</span>
        </div>
      </div>

      <div class="header-actions">
        <!-- Save Window Button -->
        <button id="saveBtn" class="action-pill-btn primary" title="Save all open tabs in this window (⌥⇧S)">
          <svg class="btn-icon" viewBox="0 0 16 16" fill="none">
            <path d="M8 3V13M3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="btn-label">Save</span>
        </button>

        <!-- Stash & Close Button -->
        <button id="stashBtn" class="action-pill-btn secondary" title="Stash tabs and close window to free RAM">
          <svg class="btn-icon" viewBox="0 0 16 16" fill="none">
            <path d="M2.5 4.5H13.5M5.5 8H10.5M7 11.5H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span class="btn-label">Stash</span>
        </button>
      </div>
    </header>

    <!-- Deep Search Panel -->
    <div class="search-bar-wrap glass-panel">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input id="search" type="text" placeholder="Search vaults, titles & URLs..." autocomplete="off" spellcheck="false" aria-label="Search saved sessions and tabs" />
      <button id="searchClearBtn" class="search-clear-btn" aria-label="Clear search" hidden>
        <svg viewBox="0 0 14 14" fill="none">
          <path d="M3.5 3.5L10.5 10.5M10.5 3.5L3.5 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="shortcut-tag" title="Press ⌘K or / to search">
        <span class="key">⌘K</span>
      </div>
    </div>

    <!-- Segmented Filter Control & Sort Toggle -->
    <div class="filter-row">
      <nav class="filter-bar glass-panel" role="tablist" aria-label="Filter vaults">
        <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
          All
        </button>
        <button class="filter-tab" data-filter="pinned" role="tab" aria-selected="false">
          <svg class="tab-badge-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 1.5l1.9 4.1 4.5.6-3.3 3.1.8 4.5L8 11.6l-3.9 2.2.8-4.5-3.3-3.1 4.5-.6L8 1.5z"/>
          </svg>
          Pinned
        </button>
        <button class="filter-tab" data-filter="normal" role="tab" aria-selected="false">
          Regular
        </button>
        <button class="filter-tab" data-filter="incognito" role="tab" aria-selected="false">
          <svg class="tab-badge-icon" viewBox="0 0 16 16" fill="none">
            <path d="M2.5 8C4.5 4.5 11.5 4.5 13.5 8C11.5 11.5 4.5 11.5 2.5 8Z" stroke="currentColor" stroke-width="1.3"/>
            <circle cx="8" cy="8" r="2" fill="currentColor"/>
          </svg>
          Incognito
        </button>
      </nav>
      <button id="sortBtn" class="sort-cycle-btn glass-panel" title="Toggle sorting order (Newest, Tabs, A-Z)">
        <svg viewBox="0 0 16 16" fill="none" style="width:11px;height:11px;"><path d="M3 4.5h10M4.5 8h7M6 11.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span id="sortLabel">Newest</span>
      </button>
    </div>

    <!-- Sessions Main Panel -->
    <section class="sessions-viewport glass-panel" aria-label="Vaults list">
      <main id="list" class="sessions-list" role="list"></main>
    </section>

    <!-- Luxury Footer Toolbar -->
    <footer class="app-footer glass-panel">
      <div class="footer-left">
        <button id="exportBtn" class="footer-icon-btn" title="Export all vaults to JSON file" aria-label="Export all vaults to JSON">
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M8 2.5V10.5M8 10.5L5 7.5M8 10.5L11 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2.5 11.5V12.5C2.5 13.0523 2.94772 13.5 3.5 13.5H12.5C13.0523 13.5 13.5 13.0523 13.5 12.5V11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>

        <label class="footer-icon-btn" for="importFile" title="Import vaults from JSON file" aria-label="Import vaults from JSON">
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M8 10.5V2.5M8 2.5L5 5.5M8 2.5L11 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2.5 11.5V12.5C2.5 13.0523 2.94772 13.5 3.5 13.5H12.5C13.0523 13.5 13.5 13.0523 13.5 12.5V11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </label>
        <input type="file" id="importFile" accept="application/json" hidden />

        <button id="copyAllMdBtn" class="footer-icon-btn" title="Copy all vaults as Markdown links" aria-label="Copy all vaults as Markdown">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M3.5 10.5H2.5C1.94772 10.5 1.5 10.0523 1.5 9.5V3.5C1.5 2.94772 1.94772 2.5 2.5 2.5H8.5C9.05228 2.5 9.5 2.94772 9.5 3.5V4.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>

        <button id="dedupAllBtn" class="footer-icon-btn" title="Clean duplicate tabs across all vaults" aria-label="Deduplicate all vaults">
          <svg viewBox="0 0 16 16" fill="currentColor">
            <path d="M7.5 2.5l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2z"/>
            <path d="M12.5 9.5l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5.5-1z"/>
            <path d="M3.5 10l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5.5-1z"/>
          </svg>
        </button>
      </div>

      <div class="footer-right">
        <span class="quick-shortcut-hint">
          <kbd>⌥</kbd><kbd>⇧</kbd><kbd>S</kbd> Quick-save
        </span>
      </div>
    </footer>

  </div>

  <!-- Portaled Floating Menu Layer -->
  <div id="menuLayer"></div>

  <!-- Apple Spring Toast Notification -->
  <aside id="toast" class="toast-bubble" role="status" aria-live="polite" hidden>
    <div class="toast-content">
      <span class="toast-icon">✓</span>
      <span id="toastMsg" class="toast-message"></span>
    </div>
    <div id="toastActions" class="toast-actions"></div>
  </aside>

  <!-- Templates -->
  <template id="emptyState">
    <div class="empty-state-card">
      <div class="empty-glow-orb">
        <svg class="empty-icon" viewBox="0 0 32 32" fill="none">
          <path d="M6 10C6 8.34315 7.34315 7 9 7H23C24.6569 7 26 8.34315 26 10V22C26 23.6569 24.6569 25 23 25H9C7.34315 25 6 23.6569 6 22V10Z" stroke="currentColor" stroke-width="2"/>
          <path d="M12 16H20M16 12V20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3 class="empty-headline">Your Vault is Empty</h3>
      <p class="empty-description">Click <strong>Save</strong> or press <kbd>⌥⇧S</kbd> anytime to lock in your current workspace tabs.</p>
    </div>
  </template>

  <template id="noMatchesState">
    <div class="empty-state-card compact">
      <div class="empty-glow-orb small">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M16 16L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3 class="empty-headline">No Matching Vaults</h3>
      <p class="empty-description">No sessions or open tabs matched "<span id="noMatchQuery"></span>".</p>
    </div>
  </template>

  <template id="skeletonState">
    <div class="skeleton-container" aria-hidden="true">
      <div class="skeleton-card">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-text-group">
          <div class="skeleton-bar w-60"></div>
          <div class="skeleton-bar w-35"></div>
        </div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-text-group">
          <div class="skeleton-bar w-50"></div>
          <div class="skeleton-bar w-25"></div>
        </div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-text-group">
          <div class="skeleton-bar w-70"></div>
          <div class="skeleton-bar w-40"></div>
        </div>
      </div>
    </div>
  </template>

  <script src="popup.js"></script>
</body>
</html>
